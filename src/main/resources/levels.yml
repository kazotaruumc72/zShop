#  ██╔══╝░░░╚═══██╗██╔══██║██║░░██║██╔═══╝░
#  ███████╗██████╔╝██║░░██║╚█████╔╝██║░░░░░
#  ╚══════╝╚═════╝░╚═╝░░╚═╝░╚════╝░╚═╝░░░░░
#
# Shop level configuration.
# Format:
#   - <level>:<bonus>
#
# <level> is the shop level number.
# <bonus> is a percentage (integer or decimal) that:
#   - Increases the amount of money earned when the player sells an item
#   - Decreases the price the player pays when buying an item
#
# Example: at level 3 with a bonus of 4, an item sold for 3 will be sold for 3.12,
# and an item bought for 10 will be bought for 9.60.
#
# Players need to have bought/sold the cumulated amount of items defined in
# progression.yml to reach the next level.
#
####################################################

# What contributes to leveling up.
# Set to false to ignore the corresponding action when computing progression.
# Default (true / true): both buys and sells count toward the next level.
count-buy: true
count-sell: true

# Progression bossbar shown to the player whenever they buy / sell something.
# The bar fills as they progress within the current level bracket and is
# automatically hidden after `duration-seconds` of inactivity.
#
# Available placeholders inside `title`:
#   %level%       current shop level
#   %level_max%   maximum level defined in this file
#   %progress%    items accumulated within the current level bracket
#   %required%   items needed to reach the next level (within the bracket)
#   %total%       lifetime cumulated items (buy + sell)
#   %percent%     0 - 100 progression toward the next level
#   %bonus%       sell/buy bonus percent at the current level
#
# `color` accepts: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
# `style` accepts: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
bossbar:
  enabled: true
  title: "&eShop level &6%level% &7| &a%progress%&7/&a%required% &7(&f%percent%%&7)"
  color: GREEN
  style: SEGMENTED_10
  duration-seconds: 5

# NOTE: Each entry is quoted because YAML 1.1 (used by Bukkit/SnakeYAML)
# would otherwise parse "1:0", "2:2", ... as sexagesimal numbers
# (1*60+0 = 60, 2*60+2 = 122, ...), which would silently break the level
# system. Always keep the quotes when adding or editing levels.
levels:
  - '1:0'
  - '2:2'
  - '3:4'
  - '4:6'
  - '5:8'
  - '6:10'
  - '7:12'
  - '8:14'
  - '9:16'
  - '10:20'
