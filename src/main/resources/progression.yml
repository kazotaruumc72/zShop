# Shop level progression.
# Format:
#   - <nextLevel>:<minimumItems>
#
# <nextLevel> is the level the player will reach.
# <minimumItems> is the cumulated amount of items the player has to buy or sell
# (counting individual items, not transactions) to unlock that level.
#
